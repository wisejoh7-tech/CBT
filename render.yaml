services:
  - type: web
    name: my-exam
    env: static
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: my-exam-backend
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: my-exam-backend
    env: node
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
